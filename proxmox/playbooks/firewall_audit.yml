---
- name: Audit Proxmox host firewall without changing it
  hosts: proxmox_hosts
  gather_facts: true
  become: true
  serial: 1
  roles:
    - role: firewall_audit

- name: Audit managed container firewalls without changing them
  hosts: managed_lxc
  gather_facts: true
  become: true
  serial: 1
  roles:
    - role: firewall_audit
