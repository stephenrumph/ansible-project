---
- name: Select read-only audit commands
  ansible.builtin.set_fact:
    firewall_selected_audit_commands: >-
      {{ firewall_host_audit_commands
         if 'proxmox_hosts' in group_names
         else firewall_guest_audit_commands }}

- name: Run read-only firewall and listener commands
  ansible.builtin.command:
    argv: "{{ item }}"
  loop: "{{ firewall_selected_audit_commands }}"
  register: firewall_audit_results
  changed_when: false
  failed_when: false
  check_mode: false
  loop_control:
    label: "{{ item | join(' ') }}"

- name: Report audit command results
  ansible.builtin.debug:
    msg:
      command: "{{ item.item | join(' ') }}"
      rc: "{{ item.rc }}"
      stdout: "{{ item.stdout }}"
      stderr: "{{ item.stderr }}"
  loop: "{{ firewall_audit_results.results }}"
  loop_control:
    label: "{{ item.item | join(' ') }}"

- name: Discover declared Proxmox firewall configuration
  ansible.builtin.find:
    paths:
      - /etc/pve/firewall
      - /etc/pve/nodes
      - /etc/pve/lxc
    patterns:
      - "*.fw"
      - "*.conf"
    recurse: true
    file_type: file
  register: proxmox_firewall_files
  changed_when: false
  when: "'proxmox_hosts' in group_names"

- name: Report declared Proxmox firewall file paths
  ansible.builtin.debug:
    msg: >-
      {{ proxmox_firewall_files.files
         | map(attribute='path')
         | sort
         | list }}
  when: "'proxmox_hosts' in group_names"
